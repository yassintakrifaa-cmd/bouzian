<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Login slager – Butcher Bouzian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>

<header class="admin">
  <div class="wrap">
    <a class="logo" href="../index.html">Bouzian<small>Beheer</small></a>
    <nav class="nav"><a href="../index.html">Naar de website</a></nav>
  </div>
</header>

<main class="wrap">
  <form class="panel form login" id="loginForm" novalidate>
    <h1>Login slager</h1>
    <p class="hint">Alleen voor personeel, om bestellingen te beheren. Klanten loggen in via <a href="../account.html">Mijn account</a>.</p>
    <label>E-mailadres<input id="user" type="email" autocomplete="email"></label>
    <label>Wachtwoord<input id="pass" type="password" autocomplete="current-password"></label>
    <p class="err" id="err" aria-live="polite"></p>
    <button class="btn" type="submit">Inloggen</button>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/database.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/helpers.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
