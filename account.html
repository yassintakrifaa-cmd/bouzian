<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mijn account – Butcher Bouzian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="index.html">Bouzian<small>Halal slagerij</small></a>
    <nav class="nav">
      <a href="bestellen.html">Bestellen</a>
      <a href="account.html" aria-current="page">Mijn account</a>
      <a href="index.html">Website</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- Niet ingelogd: inloggen of account maken -->
  <section id="loginView">
    <div class="title">
      <h1>Mijn account</h1>
      <p>Log in om uw bestellingen en hun status te bekijken.</p>
    </div>
    <div class="auth-grid">
      <form class="panel form" id="loginForm" novalidate>
        <h2>Inloggen</h2>
        <label>E-mailadres<input id="loginEmail" type="email" autocomplete="email"></label>
        <label>Wachtwoord<input id="loginPass" type="password" autocomplete="current-password"></label>
        <p class="err" id="loginErr" aria-live="polite"></p>
        <button class="btn" type="submit">Inloggen</button>
      </form>

      <form class="panel form" id="regForm" novalidate>
        <h2>Nieuw account</h2>
        <label>Naam<input id="regName" autocomplete="name"></label>
        <label>E-mailadres<input id="regEmail" type="email" autocomplete="email"></label>
        <label>Telefoon<input id="regPhone" type="tel" autocomplete="tel"></label>
        <label>Wachtwoord (min. 6 tekens)<input id="regPass" type="password" autocomplete="new-password"></label>
        <p class="err" id="regErr" aria-live="polite"></p>
        <button class="btn ghost" type="submit">Account aanmaken</button>
      </form>
    </div>
  </section>

  <!-- Ingelogd: gegevens en bestellingen -->
  <section id="accountView" hidden>
    <div class="profile">
      <div>
        <h1 id="klantNaam"></h1>
        <p id="klantGegevens"></p>
      </div>
      <div class="actions">
        <a class="btn" href="bestellen.html">Nieuwe bestelling</a>
        <button class="btn ghost" type="button" id="logout">Uitloggen</button>
      </div>
    </div>
    <h2>Mijn bestellingen</h2>
    <div id="mijnBestellingen" class="orders"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/helpers.js"></script>
<script src="js/database.js"></script>
<script src="js/opslag.js"></script>
<script src="js/auth.js"></script>
<script src="js/account.js"></script>
</body>
</html>
